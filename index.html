<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQAO AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
            body { background: white !important; }
            .sheet-container { box-shadow: none !important; border: none !important; padding: 0 !important; }
        }
        .grid-pattern { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- PASTE YOUR API KEY HERE ---
        const apiKey = "AIzaSyDIx0iwJloKHZ1vxLPNWGYOiNwYBhBHH_o"; 

        const App = () => {
            const [grade, setGrade] = useState(6);
            const [questions, setQuestions] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [error, setError] = useState(null);

            const generateTest = async () => {
                if (!apiKey) {
                    setError("API Key is missing. Please edit the code to include your Gemini API key.");
                    return;
                }

                setIsGenerating(true);
                setError(null);
                
                try {
                    // Using the stable V1 endpoint and 'gemini-1.5-flash-latest' alias
                    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
                    
                    const prompt = `Create 10 EQAO math questions for Grade ${grade} (Ontario Curriculum). Return valid JSON: { "questions": [ { "type": "mc", "strand": "Number", "text": "Question text?", "options": ["A", "B", "C", "D"], "answer": "B", "rubric": "Explanation" } ] }. Use "mc" for multiple choice and "open" for open response.`;

                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const result = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(result.error?.message || "API connection failed");
                    }

                    const rawText = result.candidates[0].content.parts[0].text;
                    const data = JSON.parse(rawText);
                    setQuestions(data.questions || []);
                    
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen pb-12">
                    <nav className="no-print bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto flex items-center justify-between">
                            <div className="flex flex-col text-left">
                                <h1 className="font-black text-xl tracking-tight uppercase italic">EQAO AI Engine</h1>
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none">
                                    {apiKey ? "🟢 API Key Ready" : "🔴 Missing API Key"}
                                </span>
                            </div>
                            <div className="flex space-x-3">
                                <select 
                                    value={grade} 
                                    onChange={(e) => setGrade(e.target.value)}
                                    className="bg-slate-100 rounded-lg px-3 py-2 text-xs font-bold outline-none border-2 border-transparent focus:border-blue-500"
                                >
                                    <option value="3">Grade 3</option>
                                    <option value="6">Grade 6</option>
                                    <option value="9">Grade 9</option>
                                </select>
                                <button 
                                    onClick={generateTest}
                                    disabled={isGenerating}
                                    className="bg-blue-600 hover:bg-slate-900 text-white px-6 py-2 rounded-lg font-black text-xs uppercase transition disabled:opacity-50 flex items-center"
                                >
                                    {isGenerating && <div className="loader mr-2"></div>}
                                    {isGenerating ? "Thinking..." : "Generate Test"}
                                </button>
                                <button onClick={() => window.print()} className="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg text-xs font-bold uppercase transition">Print</button>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-4xl mx-auto p-6">
                        {error && (
                            <div className="bg-red-50 border-2 border-red-200 p-4 rounded-xl text-red-700 text-sm font-medium mb-6 text-left">
                                <p className="font-black uppercase text-[10px] mb-1">System Error</p>
                                {error}
                            </div>
                        )}

                        <div className="sheet-container bg-white shadow-xl rounded-[2rem] border border-slate-200 p-12 min-h-[11in] text-left">
                            <div className="border-b-4 border-slate-900 pb-4 mb-8 flex justify-between items-end">
                                <div>
                                    <h2 className="text-3xl font-black uppercase italic leading-tight">Mathematics</h2>
                                    <p className="font-bold text-blue-600">EQAO Assessment • Grade {grade}</p>
                                </div>
                                <div className="text-right">
                                    <div className="w-48 border-b-2 border-slate-300 h-8 mb-1"></div>
                                    <span className="text-[9px] font-bold text-slate-400 uppercase">Student Name</span>
                                </div>
                            </div>

                            {questions.length === 0 && !isGenerating && (
                                <div className="py-20 text-center">
                                    <p className="text-slate-400 font-bold uppercase tracking-widest text-xs italic">Set your key and click generate to begin</p>
                                </div>
                            )}

                            <div className="space-y-12">
                                {questions.map((q, i) => (
                                    <div key={i} className="break-inside-avoid">
                                        <div className="flex space-x-4">
                                            <div className="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-black shrink-0 mt-1">{i + 1}</div>
                                            <div className="flex-1 space-y-4">
                                                <div className="space-y-1">
                                                    <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest italic">{q.strand}</span>
                                                    <p className="text-lg font-bold leading-relaxed">{q.text}</p>
                                                </div>
                                                
                                                {q.type === 'mc' ? (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                        {q.options.map((opt, oi) => (
                                                            <div key={oi} className="flex items-center space-x-3 p-3 border border-slate-100 rounded-xl bg-slate-50">
                                                                <div className="w-6 h-6 rounded-full border-2 border-slate-900 flex items-center justify-center font-black text-[10px] uppercase shrink-0">
                                                                    {['a','b','c','d'][oi]}
                                                                </div>
                                                                <span className="text-sm font-bold text-slate-700">{opt}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="h-48 w-full bg-slate-50 border-2 border-slate-100 rounded-2xl grid-pattern"></div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {questions.length > 0 && (
                            <div className="sheet-container bg-white shadow-xl rounded-[2rem] border border-slate-200 p-12 mt-8 page-break text-left">
                                <h3 className="text-xl font-black uppercase italic mb-6 border-b-2 border-slate-900 pb-2">Teacher Scoring Key</h3>
                                <div className="grid grid-cols-1 gap-6">
                                    {questions.map((q, i) => (
                                        <div key={i} className="p-6 bg-slate-50 rounded-2xl border border-slate-100 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="font-black text-xs text-blue-600 uppercase tracking-widest">Question {i+1} ({q.type})</span>
                                                <span className="font-black text-slate-900 uppercase">Answer: {q.answer}</span>
                                            </div>
                                            <p className="text-xs text-slate-500 leading-relaxed italic">{q.rubric}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
