<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQAO Worksheet Generator - Phase 1</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.5; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

        /* Settings Panel */
        .panel {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        h1 { font-size: 2rem; margin-bottom: 10px; color: var(--primary); }
        .subtitle { color: var(--text-light); margin-bottom: 30px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        select, input {
            width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem;
        }
        .checkboxes { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; flex: 2; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e5e7eb; color: #374151; flex: 1; }
        .btn-print { background: #10b981; color: white; flex: 1; }

        /* Worksheet Layout (Paper-Saving) */
        .worksheet {
            background: white;
            padding: 0.6in; /* Reduced margins for paper saving */
            max-width: 8.5in;
            margin: 0 auto;
            display: none;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .worksheet.active { display: block; }
        
        .ws-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .ws-header h2 { font-size: 24pt; font-family: 'Times New Roman', serif; }
        .ws-info { display: flex; justify-content: space-between; margin-top: 15px; font-family: 'Times New Roman', serif; font-size: 11pt; }
        
        .question { margin-bottom: 18px; page-break-inside: avoid; }
        .q-head { font-weight: bold; font-size: 11pt; margin-bottom: 5px; font-family: 'Times New Roman', serif; }
        .q-text { font-size: 10.5pt; margin-bottom: 8px; font-family: 'Times New Roman', serif; }
        
        /* 2-Column Multiple Choice */
        .mc-grid { column-count: 2; column-gap: 30px; padding-left: 15px; font-family: 'Times New Roman', serif; font-size: 10.5pt; }
        .mc-item { break-inside: avoid; margin-bottom: 5px; padding-left: 10px; }
        .mc-item::before { content: "◯ "; font-weight: bold; }

        .answer-space { border: 1px dashed #999; min-height: 50px; margin-top: 5px; background: #fafafa; }

        /* 3-Column Answer Key */
        .answer-key { 
            page-break-before: always; 
            column-count: 3; 
            column-gap: 15px;
            margin-top: 20px; 
            padding: 15px;
            border: 2px solid #333;
            font-family: 'Times New Roman', serif;
            font-size: 9pt;
        }
        .ak-item { break-inside: avoid; margin-bottom: 5px; }
        .ak-item strong { margin-right: 5px; }

        /* Print Styles */
        @media print {
            body { background: white; }
            .container { margin: 0; padding: 0; max-width: 100%; }
            .panel { display: none; }
            .worksheet { border: none; box-shadow: none; display: block !important; padding: 0.5in; max-width: 100%; }
            .mc-grid { column-count: 2 !important; }
            .answer-key { column-count: 3 !important; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Settings Panel -->
    <div class="panel no-print">
        <h1>📚 EQAO Worksheet Generator</h1>
        <p class="subtitle">Algorithmic Phase 1: Unlimited Questions • No API Key • Paper-Saving</p>
        
        <div class="grid">
            <div>
                <label>Grade Level</label>
                <select id="grade">
                    <option value="3">Grade 3</option>
                    <option value="6">Grade 6</option>
                    <option value="9">Grade 9 (MTH1W)</option>
                </select>
            </div>
            <div>
                <label>Test Type</label>
                <select id="type">
                    <option value="custom">Custom Practice</option>
                    <option value="full">Full-Length EQAO Test</option>
                </select>
            </div>
            <div id="strand-group">
                <label>Strand</label>
                <select id="strand">
                    <option value="all">All Strands (Balanced)</option>
                    <option value="number">Number Sense & Algebra</option>
                    <option value="measurement">Measurement</option>
                    <option value="geometry">Geometry & Spatial Sense</option>
                    <option value="data">Data & Probability</option>
                </select>
            </div>
            <div id="count-group">
                <label>Number of Questions</label>
                <input type="number" id="count" min="1" max="50" value="10">
            </div>
        </div>

        <div class="checkboxes">
            <label class="checkbox-item"><input type="checkbox" id="include-key" checked> Answer Key</label>
            <label class="checkbox-item"><input type="checkbox" id="include-rubric"> Rubric</label>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="generate()">⚡ Generate Worksheet</button>
            <button class="btn-print" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </div>

    <!-- Worksheet Output -->
    <div id="output" class="worksheet"></div>
</div>

<script>
// ===== 1. TEMPLATE DATABASE =====
// Variables: {min, max, step}. Logic uses simple math.
const templates = {
    3: {
        number: [
            { t: "Mia has {a} stickers. She buys {b} more. How many does she have now?", v: {a:[10,50], b:[5,20]}, ans: "a+b", opts: ["a+b", "a-b", "a*b", "a/b"] },
            { t: "A toy costs ${c}. You have ${d}. How much more money do you need?", v: {c:[20,99], d:[5,19], c_gt_d:true}, ans: "c-d", opts: ["c-d", "d-c", "c+d", "c*d"] },
            { t: "What is {a} x {b}?", v: {a:[2,9], b:[2,9]}, ans: "a*b", opts: ["a*b", "a+b", "a*b-a", "a*b+b"] },
            { t: "There are {a} apples shared equally among {b} baskets. How many in each?", v: {a:[2,9], b:[2,5], prod:true}, ans: "a/b", opts: ["a/b", "b/a", "a+b", "a-b"] },
            { t: "Which fraction is larger: {a}/{b} or {c}/{b}?", v: {a:[1,8], b:[3,9], c:[1,8]}, ans: "a>c?`${a}/${b}`:`${c}/${b}`" }
        ],
        measurement: [
            { t: "A rectangle is {l} cm long and {w} cm wide. What is the perimeter?", v: {l:[5,20], w:[2,10]}, ans: "2*(l+w)", opts: ["2*(l+w)", "l*w", "l+w", "2*l+w"] },
            { t: "What is the area of a square with side length {s} cm?", v: {s:[2,10]}, ans: "s*s", opts: ["s*s", "4*s", "s+s", "s/2"] },
            { t: "If a movie starts at 2:00 PM and lasts {h} hours, when does it end?", v: {h:[1,3]}, ans: `${(2+{h})}:00 PM`, opts: [`${(2+{h})}:00 PM`, `${(1+{h})}:00 PM`, `${(2+{h}+12)}:00 AM`, `12:${h*10} PM`] }
        ],
        geometry: [
            { t: "How many sides does a shape with {n} vertices have?", v: {n:[3,8]}, ans: "{n}", opts: ["{n}", "{n}+1", "{n}-1", "{n}*2"] },
            { t: "Which shape has 4 equal sides and 4 right angles?", v: {}, ans: "Square", opts: ["Square", "Rectangle", "Circle", "Triangle"] }
        ],
        data: [
            { t: "In a survey, 5 kids like pizza and 3 like burgers. How many kids were surveyed?", v: {}, ans: "8", opts: ["8", "2", "15", "10"] }
        ]
    },
    6: {
        number: [
            { t: "What is 25% of ${a}?", v: {a:[10,200], step:4}, ans: "a*0.25", opts: ["a*0.25", "a*0.5", "a*0.1", "a/2"] },
            { t: "Evaluate: {a}² + {b}", v: {a:[2,10], b:[1,20]}, ans: "a*a+b", opts: ["a*a+b", "(a+b)*2", "a+b*2", "a*a-b"] },
            { t: "Solve for x: 3x = {prod}", v: {x:[2,10], prod_is_3x:true}, ans: "{x}", opts: ["{x}", "{prod}", "{prod}/3", "{prod}*3"] },
            { t: "Order these from least to greatest: 0.{a}, {b}%, 1/{c}", v: {a:[1,8], b:[20,80], c:[2,4]}, ans: "0.{a}", opts: ["0.{a}", "{b}%", "1/{c}", "1/{a}"] }
        ],
        measurement: [
            { t: "Calculate the volume of a rectangular prism: L={l}, W={w}, H={h} cm", v: {l:[2,5], w:[2,5], h:[2,5]}, ans: "l*w*h", opts: ["l*w*h", "2*(l*w+h)", "l*w+h", "l+w+h"] },
            { t: "A triangle has base {b} and height {h}. What is the area?", v: {b:[2,12], h:[2,10]}, ans: "0.5*b*h", opts: ["0.5*b*h", "b*h", "b+h", "2*b*h"] }
        ],
        geometry: [
            { t: "What is the sum of angles in a triangle?", v: {}, ans: "180°", opts: ["180°", "360°", "90°", "270°"] },
            { t: "Which pair of angles are complementary (add to 90°)?", v: {a:[10,40], b:[10,40]}, ans: `${a}° & ${90-a}°` }
        ]
    },
    9: {
        number: [
            { t: "Simplify: 2x + 5x - 3x", v: {}, ans: "4x", opts: ["4x", "10x", "4", "7x"] },
            { t: "Expand: (x + {a})(x + {b})", v: {a:[1,5], b:[1,5]}, ans: "x^2 + {a+b}x + {a*b}", opts: ["x^2 + {a+b}x + {a*b}", "x^2 + {a*b}x + {a+b}", "x^2 + {a-b}x + {a*b}", "x^2 + {a*b}"] },
            { t: "Factor: x² + {sum}x + {prod}", v: {a:[1,9], b:[1,9], sum_is_a_plus_b:true, prod_is_a_times_b:true}, ans: "(x + {a})(x + {b})", opts: ["(x + {a})(x + {b})", "(x - {a})(x - {b})", "(x + {prod})(x + {sum})", "(x + {a})(x - {b})"] }
        ],
        measurement: [
            { t: "Find the hypotenuse of a right triangle with legs {a} and {b}.", v: {a:[3,12], b:[3,12]}, ans: "sqrt(a*a + b*b).toFixed(1)", opts: ["sqrt(a*a + b*b)", "a + b", "2*(a+b)", "sqrt(a*a - b*b)"] },
            { t: "Surface area of a cube with side {s}.", v: {s:[1,10]}, ans: "6*s*s", opts: ["6*s*s", "s*s*s", "4*s*s", "6*s"] }
        ]
    }
};

// ===== 2. LOGIC ENGINE =====
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function solve(expr, vars) {
    try {
        // Create a function context with variables available
        const func = new Function(...Object.keys(vars), `return ${expr}`);
        let res = func(...Object.values(vars));
        return typeof res === 'number' ? Math.round(res * 100) / 100 : res;
    } catch { return "Error"; }
}

function fill(str, vars) {
    return str.replace(/{(\w+)}/g, (m, p1) => vars[p1] !== undefined ? vars[p1] : m);
}

function generateQuestion(tpl) {
    let vars = {};
    // 1. Generate Variables
    for (let k in tpl.v) {
        const [min, max, step] = tpl.v[k];
        if (k.includes('_')) continue; // Derived keys
        vars[k] = rand(min, max);
    }
    // Handle specific logic flags (e.g. prod must be a*b)
    if (tpl.v.prod_is_a_times_b) vars.prod = vars.a * vars.b;
    if (tpl.v.sum_is_a_plus_b) vars.sum = vars.a + vars.b;

    // 2. Calculate Answer
    let ansRaw = solve(tpl.ans, vars);
    let finalAns = typeof ansRaw === 'string' ? fill(ansRaw, vars) : ansRaw;

    // 3. Generate Question Text
    let text = fill(tpl.t, vars);

    // 4. Generate Options (for MC)
    let options = [finalAns];
    if (tpl.opts) {
        tpl.opts.forEach(o => {
            let val = solve(o, vars);
            val = typeof val === 'string' ? fill(val, vars) : val;
            if (!options.includes(val)) options.push(val);
        });
        // Fill up to 4 if needed
        while (options.length < 4) options.push(finalAns + rand(1,10)); 
    }
    
    // Shuffle Options
    options.sort(() => Math.random() - 0.5);

    return { text, options, finalAns };
}

// ===== 3. UI CONTROLLER =====
function generate() {
    const grade = document.getElementById('grade').value;
    const type = document.getElementById('type').value;
    const strand = document.getElementById('strand').value;
    const countInput = document.getElementById('count').value;
    
    const totalQ = type === 'full' ? (grade === '9' ? 40 : 36) : parseInt(countInput) || 10;
    
    let pool = templates[grade][strand] || [];
    if (strand === 'all') {
        // Merge all strands
        Object.values(templates[grade]).forEach(arr => pool.push(...arr));
    }
    
    // If pool is small, we loop/reuse templates (variables make them unique anyway)
    const output = document.getElementById('output');
    let html = `
        <div class="ws-header">
            <h2>${type === 'full' ? 'EQAO PRACTICE TEST' : 'MATHEMATICS WORKSHEET'}</h2>
            <div style="font-size:12pt; margin-top:5px;">Grade ${grade} • Ontario Curriculum</div>
            <div class="ws-info">
                <span>Name: __________________________</span>
                <span>Date: ____________</span>
                <span>Score: ___ / ${totalQ}</span>
            </div>
        </div>
        <div style="padding:10px; background:#f0f0f0; font-size:10pt; margin-bottom:15px; border-left:4px solid #333;">
            <strong>Instructions:</strong> Read carefully. Show all steps. Calculators are [Allowed / Not Allowed].
        </div>
    `;

    let answers = [];

    for (let i = 0; i < totalQ; i++) {
        // Pick random template
        const tpl = pool[rand(0, pool.length - 1)];
        const q = generateQuestion(tpl);

        html += `<div class="question">
            <div class="q-head">Question ${i + 1}.</div>
            <div class="q-text">${q.text}</div>`;
        
        if (q.options.length > 1) {
            html += `<div class="mc-grid">`;
            q.options.forEach(opt => {
                html += `<div class="mc-item">${opt}</div>`;
            });
            html += `</div>`;
        } else {
            html += `<div class="answer-space"></div>`;
        }
        html += `</div>`;
        answers.push(`<span class="ak-item"><strong>Q${i+1}:</strong> ${q.finalAns}</span>`);
    }

    if (document.getElementById('include-key').checked) {
        html += `<div class="answer-key"><h3>🔑 Answer Key</h3>${answers.join('')}</div>`;
    }
    
    if (document.getElementById('include-rubric').checked) {
        html += `<div style="page-break-before:always; padding:20px; border:2px solid #333;">
            <h3>📊 Assessment Rubric</h3>
            <table style="width:100%; border-collapse:collapse; font-size:10pt;">
                <tr style="background:#eee;"><th>Criteria</th><th>Lvl 4 (80-100%)</th><th>Lvl 3 (70-79%)</th><th>Lvl 2 (60-69%)</th><th>Lvl 1 (50-59%)</th></tr>
                <tr><td>Knowledge</td><td>Thorough understanding</td><td>Considerable</td><td>Some</td><td>Limited</td></tr>
                <tr><td>Thinking</td><td>High effectiveness</td><td>Considerable</td><td>Some</td><td>Limited</td></tr>
            </table></div>`;
    }

    output.innerHTML = html;
    output.classList.add('active');
    output.scrollIntoView({ behavior: 'smooth' });
}

// UI Toggles
document.getElementById('type').addEventListener('change', (e) => {
    const isFull = e.target.value === 'full';
    document.getElementById('count-group').style.display = isFull ? 'none' : 'block';
    document.getElementById('strand-group').style.display = isFull ? 'none' : 'block';
});
</script>
</body>
</html>
