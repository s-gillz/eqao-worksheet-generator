<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQAO Pro - AI Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
            body { background: white !important; margin: 0; padding: 0; }
            @page { margin: 0.5in; }
            .sheet-container { 
                box-shadow: none !important; 
                border: none !important; 
                padding: 0 !important; 
                width: 100% !important; 
                margin: 0 !important;
            }
            .mc-grid {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 1.5rem !important;
            }
        }
        .grid-pattern { 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-neutral-100 font-sans text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const apiKey = ""; 

        const Icons = {
            Printer: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            ),
            Sparkles: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>
            ),
            Cpu: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
            ),
            CheckCircle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            )
        };

        const App = () => {
            const [grade, setGrade] = useState(6);
            const [strand, setStrand] = useState('All');
            const [qCount, setQCount] = useState(10);
            const [isFullTest, setIsFullTest] = useState(false);
            const [questions, setQuestions] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);
            const [showAnswerKey, setShowAnswerKey] = useState(true);
            const [showRubric, setShowRubric] = useState(true);

            const handlePrint = () => {
                window.print();
            };

            const fetchWithRetry = async (payload, retries = 5, delay = 1000) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API Error');
                    return await response.json();
                } catch (err) {
                    if (retries > 0) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return fetchWithRetry(payload, retries - 1, delay * 2);
                    }
                    throw err;
                }
            };

            const generateAITest = async () => {
                setIsGenerating(true);
                try {
                    const count = isFullTest ? 36 : qCount;
                    const systemPrompt = `You are an Ontario Certified Teacher specialized in EQAO Grade ${grade} Math. 
                    Generate ${count} math questions. 
                    Strand focus: ${strand}.
                    Questions must be curriculum aligned. 
                    Include a rubric/grading explanation for 'open' questions.`;

                    const responseSchema = {
                        type: "OBJECT",
                        properties: {
                            questions: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        type: { type: "STRING", enum: ["mc", "open"] },
                                        strand: { type: "STRING" },
                                        text: { type: "STRING" },
                                        options: { type: "ARRAY", items: { type: "STRING" } },
                                        answer: { type: "STRING" },
                                        rubric: { type: "STRING" }
                                    },
                                    required: ["type", "strand", "text", "answer", "rubric"]
                                }
                            }
                        }
                    };

                    const result = await fetchWithRetry({
                        contents: [{ parts: [{ text: `Provide ${count} unique EQAO style questions for Grade ${grade}. Use responseSchema.` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: responseSchema
                        }
                    });

                    const parsedResponse = JSON.parse(result.candidates[0].content.parts[0].text);
                    const aiData = parsedResponse.questions || [];
                    
                    setQuestions(aiData.map((q, idx) => ({ 
                        ...q, 
                        keyId: `q-${idx}-${Date.now()}` 
                    })));
                } catch (err) {
                    console.error("AI Generation Failed", err);
                } finally {
                    setIsGenerating(false);
                }
            };

            useEffect(() => {
                generateAITest();
            }, []);

            const mcQuestions = questions.filter(q => q.type === 'mc');
            const openQuestions = questions.filter(q => q.type === 'open');

            return (
                <div className="min-h-screen pb-20">
                    <nav className="no-print bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-2xl border-b border-blue-500/50">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-600 p-2 rounded-lg shadow-lg">
                                    <Icons.Cpu />
                                </div>
                                <div className="hidden sm:block">
                                    <h1 className="text-lg font-black tracking-tighter uppercase italic leading-tight">EQAO AI Engine</h1>
                                    <p className="text-[10px] text-blue-400 font-bold tracking-widest uppercase italic leading-none">Structured Data Mode</p>
                                </div>
                            </div>
                            <button 
                                onClick={handlePrint} 
                                className="px-5 py-2 bg-white text-slate-900 rounded-xl font-bold text-xs uppercase shadow-lg hover:bg-slate-200 transition flex items-center"
                            >
                                <span className="mr-2"><Icons.Printer /></span> Print / Save PDF
                            </button>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 mt-8">
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <aside className="no-print space-y-6">
                                <div className="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200 text-left space-y-6 sticky top-24">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Target Grade</label>
                                            <select value={grade} onChange={(e) => setGrade(Number(e.target.value))} className="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 font-bold text-sm outline-none focus:border-blue-500 transition">
                                                <option value={3}>Grade 3 (Primary)</option>
                                                <option value={6}>Grade 6 (Junior)</option>
                                                <option value={9}>Grade 9 (De-streamed)</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Mode</label>
                                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                                <button onClick={() => setIsFullTest(false)} className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase transition ${!isFullTest ? 'bg-white shadow text-slate-900' : 'text-slate-400'}`}>Worksheet</button>
                                                <button onClick={() => setIsFullTest(true)} className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase transition ${isFullTest ? 'bg-white shadow text-slate-900' : 'text-slate-400'}`}>Full Test</button>
                                            </div>
                                        </div>

                                        <div className="pt-4 border-t border-slate-100 space-y-2">
                                            <label className="flex items-center space-x-2 cursor-pointer">
                                                <input type="checkbox" className="w-4 h-4 rounded text-blue-600" checked={showAnswerKey} onChange={() => setShowAnswerKey(!showAnswerKey)} />
                                                <span className="text-[10px] font-black uppercase text-slate-600">Include Answer Key</span>
                                            </label>
                                            <label className="flex items-center space-x-2 cursor-pointer">
                                                <input type="checkbox" className="w-4 h-4 rounded text-blue-600" checked={showRubric} onChange={() => setShowRubric(!showRubric)} />
                                                <span className="text-[10px] font-black uppercase text-slate-600">Include Rubrics</span>
                                            </label>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={generateAITest} 
                                        disabled={isGenerating}
                                        className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-900 transition flex items-center justify-center disabled:opacity-50 shadow-lg"
                                    >
                                        {isGenerating ? <div className="loader mr-2"></div> : <span className="mr-2"><Icons.Sparkles /></span>}
                                        {isGenerating ? 'Generating...' : 'Refresh Questions'}
                                    </button>
                                </div>
                            </aside>

                            <main className="lg:col-span-3 space-y-6 text-left">
                                <div className="sheet-container bg-white shadow-2xl p-8 sm:p-12 border border-slate-200 rounded-[2rem] min-h-[11in]">
                                    <div className="flex flex-col sm:flex-row justify-between items-start border-b-4 border-slate-900 pb-4 mb-8">
                                        <div className="mb-4 sm:mb-0">
                                            <h2 className="text-3xl font-black tracking-tighter uppercase leading-tight italic">EQAO Practice Assessment</h2>
                                            <p className="text-xs font-black text-blue-600 uppercase">Grade {grade} Mathematics • Curriculum Standard</p>
                                        </div>
                                        <div className="w-full sm:w-64 border-b-2 border-slate-200 h-12 flex items-end pb-1 text-[8px] font-bold text-slate-300 uppercase italic">Student Name</div>
                                    </div>

                                    <div className="mc-grid grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10 mb-12">
                                        {mcQuestions.map((q, i) => (
                                            <div key={q.keyId} className="flex space-x-4 break-inside-avoid">
                                                <div className="w-6 h-6 rounded-lg bg-slate-900 text-white flex items-center justify-center font-black text-[10px] shrink-0 mt-1">{i+1}</div>
                                                <div className="flex-1 space-y-3">
                                                    <p className="text-sm font-bold leading-relaxed text-slate-800">{q.text}</p>
                                                    <div className="grid grid-cols-1 gap-2">
                                                        {q.options?.map((opt, oi) => (
                                                            <div key={oi} className="flex items-center space-x-2 text-[10px] border border-slate-100 p-2 rounded-lg bg-slate-50">
                                                                <div className="w-5 h-5 rounded-full border-2 border-slate-900 flex items-center justify-center font-black text-[9px] shrink-0 uppercase">{['a','b','c','d'][oi]}</div>
                                                                <span className="font-bold text-slate-700">{opt}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="space-y-12 mt-12 border-t-4 border-slate-100 pt-12">
                                        {openQuestions.map((q, i) => (
                                            <div key={q.keyId} className="break-inside-avoid space-y-6">
                                                <div className="flex items-start space-x-4">
                                                    <div className="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-lg shrink-0">{mcQuestions.length + i + 1}</div>
                                                    <div className="space-y-1">
                                                        <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest italic">{q.strand}</span>
                                                        <p className="text-xl font-bold leading-tight text-slate-900">{q.text}</p>
                                                    </div>
                                                </div>
                                                <div className="h-72 bg-slate-50 border-2 border-slate-100 rounded-[2rem] grid-pattern relative">
                                                    <div className="absolute top-4 right-4 bg-white/80 px-4 py-2 rounded-full border border-slate-200 text-[8px] font-black uppercase text-slate-400 italic">Show your full thinking here</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {questions.length > 0 && (showAnswerKey || showRubric) && (
                                    <div className="sheet-container bg-white shadow-2xl p-8 sm:p-12 border border-slate-200 rounded-[2rem] page-break">
                                        <h2 className="text-xl font-black uppercase italic mb-8 border-b-2 border-emerald-500 pb-2 flex items-center text-emerald-600">
                                            <span className="mr-3"><Icons.CheckCircle /></span> Scoring & Solution Guide
                                        </h2>
                                        
                                        {showAnswerKey && (
                                            <div className="mb-12">
                                                <h3 className="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Multiple Choice Keys</h3>
                                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                    {mcQuestions.map((q, i) => (
                                                        <div key={`ans-${i}`} className="flex space-x-3 p-3 bg-slate-50 rounded-xl border border-slate-100 items-center">
                                                            <div className="font-black text-slate-400 text-xs w-6">{i+1}.</div>
                                                            <div className="font-black text-slate-900 text-[11px] uppercase">{q.answer}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {showRubric && (
                                            <div className="space-y-8">
                                                <h3 className="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Open Response Assessment Rubrics</h3>
                                                {openQuestions.map((q, i) => (
                                                    <div key={`rubric-${i}`} className="p-6 bg-slate-50 border-2 border-slate-100 rounded-3xl space-y-4 break-inside-avoid">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-black text-xs uppercase text-blue-600">Question #{mcQuestions.length + i + 1}</span>
                                                            <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest">Teaching Notes</span>
                                                        </div>
                                                        <div>
                                                            <span className="text-[9px] font-black uppercase text-slate-400 block mb-1">Correct Answer / Model Response:</span>
                                                            <p className="text-sm font-bold text-slate-900">{q.answer}</p>
                                                        </div>
                                                        <div className="p-4 bg-white rounded-xl border border-slate-200">
                                                            <span className="text-[9px] font-black uppercase text-emerald-600 block mb-2">Grading Rubric / Criteria:</span>
                                                            <p className="text-[11px] leading-relaxed text-slate-600">{q.rubric || "No specific rubric available for this question."}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </main>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
